[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "datakart"
dynamic = ["version"]
authors = [{ name = "HYUNIL MOON", email = "hyunil.moon@gmail.com" }]
description = "datakart package for fetching data"
readme = "README.md"
keywords = [
    "datakart",
    "data.go.kr",
    "data",
    "ecos.bok.or.kr",
    "ECOS",
    "fss.or.kr",
    "FSS",
    "juso.go.kr",
    "K-data",
    "Kakao",
    "kart",
    "kostat.go.kr",
    "NAVER",
    "SGIS",
]
requires-python = ">=3.12"
dependencies = [
    "python-dateutil>=2.8.2",
    "ratelimit>=2.2.1",
    "requests>=2,<3",
    "xmltodict>=0.13.0",
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/himoon/datakart"
Issues = "https://github.com/himoon/datakart/issues"


[tool.hatch.version]
source = "vcs"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "mypy>=1.19.1",
    "pandas>=2.3.3",
    "pytest>=8.4.2",
    "python-dotenv>=1.2.1",
    "ruff>=0.15.8",
    "types-python-dateutil>=2.9.0.20260124",
    "types-requests>=2.32.4.20260107",
]
